---
layout: default
---
<main class="profile-page">
  <nav aria-label="Social profiles">
    <ul class="profile-links">
      {% for link in site.data.links %}
        <li>
          <a href="{{ '/' | append: link.slug | append: '/' | relative_url }}" rel="me" aria-label="{{ link.label | escape }}">
            <span class="profile-icon profile-icon--{{ link.key | escape }}" style="--icon-url: url('{{ link.icon | relative_url | escape }}')" aria-hidden="true"></span>
          </a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</main>
